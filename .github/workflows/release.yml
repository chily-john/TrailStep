name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  changesets:
    name: Manual Changesets release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Public package pack dry-run
        run: pnpm run pack:public:dry-run

      - name: Prepare or publish Changesets release
        uses: changesets/action@v2
        with:
          version-script: pnpm run version
          publish-script: pnpm exec changeset publish
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          # setup-node writes a .npmrc that points npm at this token, so
          # `changeset publish` (which shells out to npm) can authenticate.
          #
          # The token must be able to publish the @trailstep scope AND must be
          # allowed to publish directly. npm is restricting 2FA-bypass tokens
          # for direct publishing; a publish attempt with one fails with an
          # opaque "404 Not Found - PUT .../package" even though the account
          # owns the package. Use a granular access token scoped to
          # @trailstep with read-write and 2FA bypass, or switch this workflow
          # to npm trusted publishing (OIDC) - the job already requests
          # id-token: write for it.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
