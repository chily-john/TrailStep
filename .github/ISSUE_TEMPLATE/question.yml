name: Question
description: Ask a usage or project direction question.
title: "question: "
labels: [question]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What would you like to know?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What are you trying to accomplish?
  - type: textarea
    id: attempted
    attributes:
      label: What have you tried?
